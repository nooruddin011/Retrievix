[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahsr"
version = "0.2.0"
description = "Agentic hybrid search router: dense + learned sparse retrieval, RRF, LangGraph agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.10", "langgraph>=0.2",
  "httpx>=0.27", "numpy>=1.26", "anthropic>=0.40", "pydantic>=2",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8", "pyflakes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahsr = ["web/*.html", "web/*.svg", "web/css/*.css", "web/js/*.js", "web/js/**/*.js", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
